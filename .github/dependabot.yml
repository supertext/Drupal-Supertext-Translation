version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/demo"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/demo"
    schedule:
      interval: "weekly"
    ignore:
      # PHP major/minor follows Drupal's supported versions; change it by hand.
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
